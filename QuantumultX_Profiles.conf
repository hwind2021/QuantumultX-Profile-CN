[policy]
; ============================================================
; 策略组 - 2026 排布: 被引用的组先定义, 组组带 Koolson/Qure 图标
;
; ⚠️ 地区组必须用 server-tag-regex 正则匹配"订阅节点名"来定义
;    (机场节点名通常带 香港/HK/日本/JP 等关键词), 不能直接引用不存在的名字,
;    否则导入报"未知策略或节点"!
;
; ⚡ 极速测速 (url-latency-benchmark) - 定时自动测速选最快节点:
;   check-interval=600   每 600 秒(10 分钟)测速一次
;   alive-checking=true  即使策略空闲(无流量经过)也按间隔持续测速 ← 定时核心参数
;   tolerance=0          只要发现延迟更低的节点就立即切换(可调大如 100 防频繁切换)
;   依赖 [general] 的 server_check_url / server_check_timeout (已配置)
; ============================================================
static = 🇭🇰 香港节点, server-tag-regex=香港|🇭🇰|HK|Hong, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/HK.png
static = 🇯🇵 日本节点, server-tag-regex=日本|🇯🇵|JP|Japan, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/JP.png
static = 🇺🇸 美国节点, server-tag-regex=美国|🇺🇸|US|States, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/US.png
static = 🇸🇬 新加坡节点, server-tag-regex=新加坡|狮城|🇸🇬|SG|Singapore, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/SG.png
url-latency-benchmark = ⚡ 极速测速, server-tag-regex=^.*, check-interval=600, alive-checking=true, tolerance=0
static = 节点选择, ⚡ 极速测速, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇸 美国节点, 🇸🇬 新加坡节点, direct, reject, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/Proxy.png
static = 📺 Netflix, 节点选择, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/Netflix.png
static = 🎬 YouTube, 节点选择, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/YouTube.png
; ---- 拦截类: 默认 reject, 误伤时可临时切 direct 排查 ----
static = Advertising, reject, direct, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/Advertising.png
static = Privacy, reject, direct, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/AdBlack.png
static = Hijacking, reject, direct, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/Hijacking.png
; ---- 国外类: 默认走节点选择 ----
static = Apple, direct, 节点选择, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/Apple.png
static = Global, 节点选择, direct, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/Global.png
static = GlobalMedia, 节点选择, direct, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/GlobalMedia.png
static = PrivateTracker, 节点选择, direct, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/Download.png
; ---- 国内类: 默认 direct ----
static = China, direct, 节点选择, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/China.png
static = ChinaMedia, direct, 节点选择, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/DomesticMedia.png
static = ChinaASN, direct, 节点选择, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/China_Map.png
static = ChinaIPs, direct, 节点选择, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/Direct.png
static = 国内直连, direct, reject, img-url=https://raw.githubusercontent.com/hwind2021/QuantumultX-Profile-CN/main/icons/Domestic.png


[server_remote]
; ⚠️⚠️⚠️ 必须填你自己的机场订阅链接 ⚠️⚠️⚠️
;
; 1. 登录你买的机场官网, 找到「我的订阅」/「订阅链接」
; 2. 复制形如 https://example.com/link/xxxxxx?clash=1 的链接
; 3. 替换下面示例的整段内容(注意保留最后的参数)
; 4. Quantumult X 主界面 → 底部「配置文件」→ 长按 → 更新配置
;
; 国内访问 (raw.githubusercontent.com 经常断流), 把 URL 替换成 jsdelivr CDN:
;   https://你的机场域名/link/...  →  https://cdn.jsdelivr.net/gh/<owner>/<repo>@<branch>/<path>
; ⚠️ 机场订阅一般不走 jsdelivr (机场通常 API/订阅链接直接给的就是机场自己的 CDN)
;     所以机场订阅保持原 URL 即可。
;
; ============= 把下面这一行换成你自己的机场订阅 =============
; https://你的机场域名/link/你的token, tag=📡 我的机场节点, update-interval=86400, opt-parser=true, enabled=true


[filter_local]
; ==== 误伤修复白名单(本地规则优先于远程规则, 先于一切 REJECT 匹配) ====
; 迅雷: blackmatrix7 Advertising.list 误杀登录接口 api-u-ssl/api-shoulei-ssl
;       .xunlei.com → 登录一直失败, 整域直连修复
host-suffix, xunlei.com, direct
host-suffix, sandai.net, direct
; QQ同步助手: blackmatrix7 Privacy.list 误杀 id6.me(腾讯统一账号验证服务),
;   且同步 API 出境(走代理)时腾讯服务端判定境外 IP → 「该国家地区未开通服务」
host-suffix, id6.me, direct
host-suffix, sync.qq.com, direct
host-suffix, local, direct
host-suffix, lan, direct
# 兜底规则: 此为必需规则, 不在上述所有规则(远程+本地)中的剩余请求走这条
# 仅可修改对应策略组, 请勿删除 final
final, 节点选择


