name: Auto-update QuantumultX profile

on:
  push:
    branches:
      - main
  schedule:
    # 每周日 04:00 (UTC+8)  =  Saturday 20:00 UTC
    - cron: '0 20 * * 6'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建（即使文件未变也提交）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch upstream reference (KOP-XIAO template segments)
        run: |
          mkdir -p .workbuddy_refs
          curl -fsSL "https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/QuantumultX_Profiles.conf" \
            -o .workbuddy_refs/kop_xiao.conf || echo "WARN: KOP-XIAO 上游拉取失败，跳过模板段同步"

      - name: Run build_conf.py
        run: python build_conf.py

      - name: Validate segments
        id: validate
        run: |
          python - << 'PYEOF'
          import re, sys
          try:
              with open('QuantumultX_Profiles.conf', 'r', encoding='utf-8') as f:
                  txt = f.read()
          except FileNotFoundError:
              print('FAIL: QuantumultX_Profiles.conf not found'); sys.exit(1)
          required = ['[general]', '[server_remote]', '[policy]', '[filter_remote]', '[rewrite_remote]', '[task_local]']
          missing = [r for r in required if r not in txt]
          if missing:
              print(f'FAIL: 缺失段位 {missing}'); sys.exit(1)
          filter_n = len(re.findall(r'^\s*https?://[^\s,;]+\.list', txt, re.MULTILINE))
          rewrite_n = len(re.findall(r'^\s*https?://[^\s,;]+\.conf', txt, re.MULTILINE))
          print(f'PASS: filter={filter_n} rewrite={rewrite_n}')
          PYEOF

      - name: Auto-commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet QuantumultX_Profiles.conf && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "NO_CHANGES"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git add QuantumultX_Profiles.conf
            MSG="chore: 自动更新主配置 $(date -u +'%Y-%m-%d %H:%M UTC')"
            if [ -n "${{ github.event.head_commit.message }}" ]; then
              MSG="chore: 自动更新主配置（手动触发）"
            fi
            git commit -m "$MSG"
            git push
            echo "PUSHED"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Purge jsdelivr CDN cache
        if: always()
        run: |
          # 主配置/重写包/兼底列表被 QX 订阅后走 jsdelivr;
          # 主动 purge 让 CDN 缓存归零, 下一次拉取即为最新内容 ——
          # 消除「推送后手机要等 10-15 分钟缓存过期」的滞后性。
          FILES=(
            "QuantumultX_Profiles.conf"
            "rewrite-local/App-Killers.conf"
            "rewrite-local/AdBlock-All.conf"
            "rewrite-local/AdBlock-Script.conf"
            "rewrite-local/AllInOne.conf"
            "filter/AdSDK-Fallback.list"
          )
          # scripts/ 下全部 js 一并刷新(上游脚本升级后引用立即生效)
          while IFS= read -r f; do FILES+=("$f"); done < <(git ls-files 'scripts/*.js')
          for f in "${FILES[@]}"; do
            if curl -fsSL "https://purge.jsdelivr.net/gh/hwind2021/QuantumultX-Profile-CN@main/$f" > /dev/null 2>&1; then
              echo "purged: $f"
            else
              echo "WARN: purge 失败(不影响推流, 等缓存自然过期): $f"
            fi
          done
